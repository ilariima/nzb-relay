name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  macos:
    runs-on: macos-15
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify ad-hoc signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "dist/mac-arm64/NZB Relay.app"
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          # GitHub replaces spaces with dots in release asset names, so rename the
          # artifacts to their published names before hashing. Without this the
          # checksum file lists names that no downloaded file has, and
          # `shasum -c SHA256SUMS.txt` fails even though the hashes are correct.
          for file in *.dmg *.zip; do
            published="${file// /.}"
            [ "$file" = "$published" ] || mv -- "$file" "$published"
          done
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: NZB-Relay-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "NZB Relay $GITHUB_REF_NAME" \
              --generate-notes

          gh release upload "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --clobber
