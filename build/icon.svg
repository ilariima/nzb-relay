<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Two routes converge into one: the indexer is contacted once, over one path.
       Geometry follows the macOS Big Sur grid - an 824px squircle centred in a
       1024px canvas, leaving margin for the system's own shadow. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7bf0"/>
      <stop offset="1" stop-color="#0a53c4"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#face)"/>

  <g fill="none" stroke="#ffffff" stroke-width="92" stroke-linecap="round">
    <path d="M280 300c132 0 172 212 240 212"/>
    <path d="M280 724c132 0 172-212 240-212"/>
    <path d="M455 512h289"/>
  </g>
</svg>
